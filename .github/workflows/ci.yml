name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Toolchains the M1 corpus runs for real (RFC §10, M1 exit criterion).
      - run: pip install pytest ruff
      - run: npm install -g typescript@6 eslint@10
      - run: php --version && git version
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # The pure-Go build must keep working: tree-sitter tools report
      # ErrUnavailable without CGO (RFC §8.1).
      - run: CGO_ENABLED=0 go vet ./... && CGO_ENABLED=0 go build ./cmd/spine
      - run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
          SPINE_CHAOS_ITERS: "40"
          SPINE_CORPUS_REQUIRE: "1"
